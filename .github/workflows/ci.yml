name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --python ${{ matrix.python }}
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pytest -q
      - run: uv build
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: dist
          path: dist/

  # Runs against a real, logged-in Kiro CLI. Only on self-hosted runners that have one;
  # trigger manually with the "integration" input or set the KIRO_INTEGRATION repository variable.
  integration:
    if: vars.KIRO_INTEGRATION == '1'
    runs-on: [self-hosted, kiro]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run kiro-acp doctor
      - run: KIRO_INTEGRATION=1 uv run pytest -q -m integration
