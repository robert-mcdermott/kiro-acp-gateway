[project]
name = "kiro-acp-gateway"
version = "0.1.0"
description = "Agent Client Protocol (ACP) client library, CLI utility, and OpenAI/Anthropic-compatible gateway for the Kiro CLI"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Robert McDermott", email = "robert.c.mcdermott@gmail.com" }]
requires-python = ">=3.11"
keywords = ["kiro", "acp", "agent-client-protocol", "openai", "anthropic", "gateway"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "jsonschema>=4.26.0",
]

[project.scripts]
kiro-acp = "kiro_acp.cli.main:main"
kiro-gateway = "kiro_acp.gateway.main:main"

[project.urls]
Homepage = "https://github.com/rmcdermo/kiro-acp-gateway"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "openai>=1.50",
    "anthropic>=0.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kiro_acp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires a working kiro-cli installation (set KIRO_INTEGRATION=1)"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501", "ASYNC109", "ASYNC240", "B008"]
